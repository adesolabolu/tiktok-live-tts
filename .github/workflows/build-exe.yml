name: Build Windows Executable (.exe)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile to Standalone .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "TikTokLiveTTS" `
            --icon "icon.ico" `
            --hidden-import uvicorn `
            --hidden-import uvicorn.config `
            --hidden-import uvicorn.main `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import webview `
            --hidden-import clr `
            --hidden-import pythonnet `
            --copy-metadata uvicorn `
            --add-data "icon.ico;." `
            --add-data "icon.png;." `
            --add-data "app.py;." app.py

      - name: Compile Standalone GUI Updater with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "updater" `
            --icon "icon.ico" `
            updater.py
          Copy-Item -Path "dist/updater.exe" -Destination "dist/TikTokLiveTTS/updater.exe"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build Inno Setup Installer (TikTokLiveTTS-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Compress Executable into ZIP
        run: |
          powershell Compress-Archive -Path dist/TikTokLiveTTS -DestinationPath dist/TikTokLiveTTS-Windows.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveTTS-Package
          path: |
            dist/TikTokLiveTTS-Setup.exe
            dist/TikTokLiveTTS-Windows.zip

      - name: Release Executable on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TikTokLiveTTS-Setup.exe
            dist/TikTokLiveTTS-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
