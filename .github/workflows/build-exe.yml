name: Build Windows Executable (.exe)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile to Standalone .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "TikTokLiveTTS" `
            --hidden-import uvicorn `
            --hidden-import uvicorn.config `
            --hidden-import uvicorn.main `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --copy-metadata uvicorn `
            --add-data "app.py;." app.py

      - name: Compress Executable into ZIP
        run: |
          powershell Compress-Archive -Path dist/TikTokLiveTTS -DestinationPath dist/TikTokLiveTTS-Windows.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveTTS-Windows
          path: dist/TikTokLiveTTS-Windows.zip

      - name: Release Executable on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TikTokLiveTTS-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
